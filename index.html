<main>
    <script>
        /**
        * Registra una interacción del usuario.
        *
        * @ejemplo
        * __registrarInteraccion({ idUsuario: 2, seccion: "RRPP", accion: "ver material", detalle: "Módulo 12, clase 1, MAT, láminas" })
        *
        * @param {object} interaccion: objeto que representa la interacción del usuario.
        * @param {number} interaccion.idUsuario: ID del usuario.
        * @param {string} interaccion.seccion: sección actual.
        * @param {string} interaccion.accion: acción realizada por usuario.
        * @param {string | undefined} interaccion.detalle: (opcional) detalle de la acción realizada por usuario.
        */
        function _registrarInteraccion(interaccion) {
            const interaccionEjemplo = {
                "idUsuario": 1,
                "seccion": "RRPP",
                "accion": "ver material",
                "detalle": "Lenguaje y Comunicación, módulo 20, clase 2, Proyectables",
            };

            if (typeof interaccion !== "object") {
                console.error(`interacción provista inválida, se esperaba 'object', pero se recibió '${typeof interaccion}'`, {
                    interaccionProvista: interaccion,
                    interaccionEjemplo,
                });
                return;
            }

            const idUsuario = Number(interaccion.idUsuario);

            if (Number.isNaN(idUsuario) || !Number.isInteger(idUsuario)) {
                console.error("propiedad 'idUsuario' no es un número entero", {
                    interaccionProvista: interaccion,
                    interaccionEjemplo,
                });
                return;
            }

            const seccion = interaccion.seccion ?? "";
            const accion = interaccion.accion ?? "";
            const detalle = interaccion.detalle ?? "";

            if (typeof seccion !== "string") {
                console.error("propiedad 'seccion' no es un string", {
                    interaccionProvista: interaccion,
                    interaccionEjemplo,
                });
                return;
            }

            if (seccion === "") {
                console.error("propiedad 'seccion' está vacía", {
                    interaccionProvista: interaccion,
                    interaccionEjemplo,
                });
                return;
            }

            if (typeof accion !== "string") {
                console.error("propiedad 'accion' no es un string", {
                    interaccionProvista: interaccion,
                    interaccionEjemplo,
                });
                return;
            }

            if (accion === "") {
                console.error("propiedad 'accion' está vacía", {
                    interaccionProvista: interaccion,
                    interaccionEjemplo,
                });
                return;
            }

            if (typeof detalle !== "string") {
                console.error("propiedad 'detalle' no es un string", {
                    interaccionProvista: interaccion,
                    interaccionEjemplo,
                });
                return;
            }

            const horaLocal = (new Date).toLocaleString();

            window.dataLayer.push({
                "event": "contexto-actualizado",
                "idUsuario": idUsuario,
                "seccion": seccion,
                "accion": accion,
                "detalle": detalle,
                "horaLocal": horaLocal,
            });
        }
    </script>

    <button onclick="_registrarInteraccion()">
        Registrar interacción
    </button>
</main>

<style>
    button {
        width: 100%;
    }
</style>
</body>
</html>
