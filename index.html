<main>
    <script>
        function _inicializarContexto() {
            window._contexto = {};
        }

        function _actualizarContexto(interaccion = {}) {
            if (typeof interaccion !== "object") {
                console.error("interacción no es un objeto", { interaccion });
                return;
            }

            if (typeof _contexto !== "object") {
                console.warn("contexto inválido, reinicializando");
                _inicializarContexto();
            }

            for (const key in interaccion) {
                window._contexto[key] = interaccion[key];
            }

            window._contexto.horaLocal = (new Date).toISOString();

            window.dataLayer.push({
                "event": "contexto-actualizado",
            });
        }

        (function() {
            _inicializarContexto();

            window._contexto = {
                version: 4,
                idUsuario: 10,
                asignatura: "Lenguaje y Comunicación",
                nivel: "4° básico",
                modulo: "Aprender a leer",
            };
        })();
    </script>

    <button onclick="_actualizarContexto()">
        Actualizar contexto
    </button>
</main>

<style>
    button {
        width: 100%;
    }
</style>
</body>
